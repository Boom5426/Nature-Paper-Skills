name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit and installation integration tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n install.sh
      - name: Install all skills and verify the installation
        run: |
          bash install.sh --dest "${RUNNER_TEMP}/skills" --set all
          bash install.sh --dest "${RUNNER_TEMP}/skills" --set all --doctor
      - name: Repeat installation and verify again
        run: |
          bash install.sh --dest "${RUNNER_TEMP}/skills" --set all
          bash install.sh --dest "${RUNNER_TEMP}/skills" --set all --doctor
      - name: Validate behavior evaluation assets
        run: python scripts/check_behavior_assets.py

  optional-helpers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bibtexparser: ['1.4.4', '2.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional helper dependencies
        run: python -m pip install "bibtexparser==${{ matrix.bibtexparser }}" requests matplotlib scipy PyYAML PyMuPDF
      - name: Test helper compatibility and rendered figure geometry
        run: python -m unittest discover -s tests -v
